# Agroxarita V2 — GitHub Actions (GitLab CI bilan bir xil oqim: test -> build/push -> deploy)
# Obrazlar: ghcr.io/<owner>/<repo>/backend|frontend
# Secrets (Settings > Secrets and variables > Actions):
#   SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH
# Serverda .env: REGISTRY_IMAGE=ghcr.io/<owner>/<repo> (GitHub'dan deploy qilinsa)
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Production'ga chiqarish"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: agroxarita
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend obrazini yig'ish
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: agroxarita-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      # testlar aynan production obrazida (GDAL/GEOS bir xil)
      - name: pytest
        run: >
          docker run --rm --network host
          -e DB_HOST=127.0.0.1 -e DB_NAME=agroxarita -e DB_USER=postgres -e DB_PASSWORD=postgres
          -e SECRET_KEY=ci-test-kaliti -e DEBUG=False
          --entrypoint python agroxarita-backend:test -m pytest -q --create-db -p no:cacheprovider

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        qism: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nom
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.qism }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.qism }}
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
            ${{ steps.nom.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.qism }}
          cache-to: type=gha,scope=${{ matrix.qism }},mode=max

  deploy:
    # faqat qo'lda: Actions > ci-cd > Run workflow > deploy = true
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    environment: production
    steps:
      - name: SSH orqali deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && git pull --ff-only && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && ./deploy/deploy.sh ${{ github.sha }}"
