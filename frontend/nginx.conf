# Frontend konteyneri: SPA + backend (gunicorn) ga proksi. TLS — serverdagi tashqi proksi/sertifikat (docs/DEPLOY.md).
# Tile keshi (MVT + DEM): muddat backend Cache-Control'idan (kontur 1 soat, chegaralar 1 kun). Konteyner qayta
# yaratilganda (har deploy) tozalanadi; ma'lumot importidan keyin: docker compose restart web emas — `up -d --force-recreate web`.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=24h use_temp_path=off;

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;

    # Vite build fayllari (hash nomli) — uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # maplibre-gl worker fayllari (ES modul, hash'siz nom): JS MIME shart (modul worker), versiya yangilanganda eski kesh qolmasin
    location ~ ^/assets/maplibre-gl-(worker|shared)\.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /static/ {
        alias /static/;
        expires 7d;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # MVT va DEM tile'lar — backend Cache-Control sarlavhasini o'zi beradi
    location /tiles/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_cache tiles;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_valid 204 10m;          # bo'sh tile (backend Cache-Control bermaydi)
        proxy_cache_lock on;                # bir xil tile'ga parallel so'rovlar — backendga bitta
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        # zoom paytida brauzer so'rovni bekor qilsa ham javob oxirigacha olinadi va keshga tushadi
        # (aks holda backend baribir hisoblaydi, natija esa tashlab yuboriladi)
        proxy_ignore_client_abort on;
        add_header X-Tile-Cache $upstream_cache_status;
        gzip on;
        gzip_types application/x-protobuf application/vnd.mapbox-vector-tile;
    }

    # SPA: react-router yo'llari index.html ga
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
