# Frontend konteyneri: SPA + backend (gunicorn) ga proksi. TLS — serverdagi tashqi proksi/sertifikat (docs/DEPLOY.md).
upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;

    # Vite build fayllari (hash nomli) — uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # maplibre-gl worker fayllari (ES modul, hash'siz nom): JS MIME shart (modul worker), versiya yangilanganda eski kesh qolmasin
    location ~ ^/assets/maplibre-gl-(worker|shared)\.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /static/ {
        alias /static/;
        expires 7d;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # MVT va DEM tile'lar — backend Cache-Control sarlavhasini o'zi beradi
    location /tiles/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        gzip on;
        gzip_types application/x-protobuf application/vnd.mapbox-vector-tile;
    }

    # SPA: react-router yo'llari index.html ga
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
