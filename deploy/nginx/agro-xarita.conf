# Host nginx (umumiy server): /etc/nginx/sites-available/agro-xarita → sites-enabled ga symlink.
# TLS — serverdagi boshqa *.agro.uz saytlari bilan bir xil snippet'lar. Faqat yangi fayl; mavjud saytlarga tegilmaydi.
# O'rnatish: docs/DEPLOY.md ("Host nginx").
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name agro-xarita.agro.uz;

	include snippets/self-signed.conf;
	include snippets/ssl-params.conf;

	client_max_body_size 20m;

	location / {
		proxy_pass http://127.0.0.1:8090;   # web konteyneri (.env: HTTP_BIND)
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 10s;
		proxy_read_timeout 120s;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name agro-xarita.agro.uz;
	return 301 https://$server_name$request_uri;
}
