# Agroxarita V2 — production (umumiy server, repo katalogidan). Batafsil: docs/DEPLOY.md
# Obrazlar serverda yig'iladi: `docker compose build` (registry ishlatilsa — REGISTRY_IMAGE + `pull`).
# Resurs chegarasi (jami): CPU 6 yadro (db 3 + backend 2 + redis 0.5 + web 0.5), RAM ~5.1 GB (3g + 1.5g + 384m + 256m).
# Umumiy server qoidalari: tashqariga faqat web (127.0.0.1), har servisda xotira/CPU chegarasi,
# log hajmi cheklangan, tarmoq subneti aniq — boshqa loyihalar bilan to'qnashmasin.
name: agroxarita

x-umumiy: &umumiy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-backend: &backend
  <<: *umumiy
  image: ${REGISTRY_IMAGE:-agroxarita}/backend:${TAG:-latest}
  build:
    context: ./backend
    args:
      AGRO_UID: ${AGRO_UID:-10001}
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
  volumes:
    - ${DATA_PATH:-./data}:/data
    - static:/app/staticfiles
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  mem_limit: ${BACKEND_MEM:-1500m}
  cpus: ${BACKEND_CPUS:-2}

services:
  db:
    <<: *umumiy
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE:-2GB}
      -c work_mem=${PG_WORK_MEM:-32MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      -c max_connections=50
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${BACKUP_PATH:-./backups}:/backups
    shm_size: 1g
    mem_limit: ${DB_MEM:-3g}
    cpus: ${DB_CPUS:-3}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *umumiy
    image: redis:7-alpine
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save ""
    mem_limit: ${REDIS_MEM:-384m}
    cpus: 0.5

  backend:
    <<: *backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Bir martalik buyruqlar uchun (import, iqlim yuklash): docker compose run --rm manage <buyruq>
  manage:
    <<: *backend
    entrypoint: ["./docker-entrypoint.sh", "python", "manage.py"]
    command: ["help"]
    restart: "no"
    profiles: ["tools"]

  web:
    <<: *umumiy
    image: ${REGISTRY_IMAGE:-agroxarita}/frontend:${TAG:-latest}
    build: ./frontend
    ports:
      # faqat localhost — tashqariga host nginx chiqaradi. 8080 band (jenkins), 80/443 — host nginx
      - "${HTTP_BIND:-127.0.0.1:8090}:80"
    volumes:
      - static:/static:ro
    depends_on:
      - backend
    mem_limit: 256m
    cpus: 0.5

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  static:
