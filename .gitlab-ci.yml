stages:
  - build

variables:
  IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/$CI_COMMIT_REF_NAME

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:
  tags:
    - docker
  stage: build
  image: docker:24.0.5
  only:
    - dev
    - main
  script:
    - docker build --build-arg config=$CI_COMMIT_REF_NAME -t $IMAGE .
    - docker push $IMAGE
