# Agroxarita V2 — GitLab CI/CD
# test (backend pytest obraz ichida + frontend lint/build) -> build/push (registry) -> deploy (main, SSH)
#
# CI/CD o'zgaruvchilari (Settings > CI/CD > Variables, protected + masked):
#   SSH_PRIVATE_KEY   — deploy foydalanuvchisining kaliti (File emas, Variable)
#   SSH_KNOWN_HOSTS   — `ssh-keyscan <server>` natijasi
#   DEPLOY_HOST       — server manzili
#   DEPLOY_USER       — masalan deploy (docker guruhida)
#   DEPLOY_PATH       — /opt/agroxarita

stages: [build, test, release, deploy]

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  DOCKER_TLS_CERTDIR: "/certs"

.docker:
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:backend:
  extends: .docker
  stage: build
  script:
    - docker pull $BACKEND_IMAGE:latest || true
    - docker build --cache-from $BACKEND_IMAGE:latest -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - changes: [backend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:frontend:
  extends: .docker
  stage: build
  script:
    - docker pull $FRONTEND_IMAGE:latest || true
    - docker build --cache-from $FRONTEND_IMAGE:latest -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - changes: [frontend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Backend testlari — aynan production obrazida (GDAL/GEOS bir xil)
test:backend:
  stage: test
  needs: [build:backend]
  image: $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  services:
    - name: postgis/postgis:17-3.5
      alias: db
  variables:
    POSTGRES_DB: agroxarita
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DB_HOST: db
    DB_NAME: agroxarita
    DB_USER: postgres
    DB_PASSWORD: postgres
    SECRET_KEY: ci-test-kaliti
    DEBUG: "False"
  script:
    - cd /app
    # CI da superuser bor — test bazasi har safar yangidan yaratiladi (lokal qoidadan farqli)
    - python -m pytest -q --create-db -p no:cacheprovider
  rules:
    - changes: [backend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:frontend:
  stage: test
  needs: []
  image: node:22-alpine
  cache:
    key: { files: [frontend/package-lock.json] }
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build
  rules:
    - changes: [frontend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# main: sinalgan obrazlarni latest va SHA bilan belgilash
release:
  extends: .docker
  stage: release
  script:
    - for i in $BACKEND_IMAGE $FRONTEND_IMAGE; do
        docker pull $i:$CI_COMMIT_SHORT_SHA &&
        docker tag $i:$CI_COMMIT_SHORT_SHA $i:latest &&
        docker push $i:latest;
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && git pull --ff-only && echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && ./deploy/deploy.sh $CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
